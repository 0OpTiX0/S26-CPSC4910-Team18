<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css"> 
    <title>Sponsor Programs - Good Driver</title>
</head>

<body class="bg-slate-50 min-h-screen font-sans pb-20">

    <nav class="p-6 bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-2">
                <div class="h-8 w-8 rounded-lg bg-slate-900 text-white flex items-center justify-center shadow-md">🚗</div>

            <div class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">

            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 lg:p-8">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="sponsor-container">
            <div class="col-span-full py-20 text-center">

                <p class="text-slate-500 font-medium">Fetching active programs...</p>
            </div>

    <script src="../config.js"></script>
