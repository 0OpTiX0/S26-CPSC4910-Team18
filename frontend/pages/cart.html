<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Good Driver</title>
    <link rel="stylesheet" href="output.css">
    <script src="../config.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <nav class="p-6 bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="store_catalog.html" class="text-sm font-bold text-blue-600 hover:text-blue-700 transition-colors flex items-center gap-2">
                <span class="text-lg leading-none">←</span> Back to Store
            </a>
            
            <h1 class="font-black text-xl tracking-tight text-slate-900 hidden sm:block">Shopping Cart</h1>
            
            <!-- NEW: Driver's current balance display so they know what they can afford -->
            <div class="flex items-center gap-2 bg-blue-50 px-4 py-2 rounded-full border border-blue-100 shadow-inner">
                <span class="text-[10px] font-black text-blue-400 uppercase tracking-tighter">Your Balance</span>
                <span id="display-points" class="font-black text-blue-700">0</span>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto p-6 py-12">
        <div id="cart-items-list" class="space-y-4">
            <div class="p-20 text-center bg-white rounded-3xl border border-slate-200 shadow-sm">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-4"></div>
                <p class="text-slate-500 font-medium">Loading your cart...</p>
            </div>
        </div>

        <div id="order-summary" class="mt-10 bg-slate-900 text-white p-8 rounded-3xl shadow-xl hidden">
            <div class="flex justify-between items-end mb-8 border-b border-slate-700 pb-6">
                <span class="text-slate-400 font-bold uppercase tracking-widest text-xs">Total Cart Cost</span>
                <span id="total-cost" class="text-4xl font-black text-white tracking-tight">0 pts</span>
            </div>
            <button id="checkout-btn" class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-500 transition-all active:scale-95 shadow-lg shadow-blue-600/30">
                Place Order
            </button>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
