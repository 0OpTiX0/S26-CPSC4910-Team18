<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Good Driver</title>
    <link rel="stylesheet" href="output.css">
    <script src="../config.js"></script>
    <script src="../js/api.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <nav class="p-6 bg-white border-b border-slate-200">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="store_catalog.html" class="text-sm font-bold text-blue-600 hover:text-blue-700">← Back to Store</a>
            <h1 class="font-black text-xl tracking-tight text-slate-900">Shopping Cart</h1>
            <div class="w-20"></div> </div>
    </nav>

    <main class="max-w-3xl mx-auto p-6 py-12">
        <div id="cart-items-list" class="space-y-4">
            <div class="p-20 text-center bg-white rounded-3xl border border-slate-200">
                <p class="text-slate-400">Loading your cart...</p>
            </div>
        </div>

        <div id="order-summary" class="mt-10 bg-slate-900 text-white p-8 rounded-3xl shadow-xl hidden">
            <div class="flex justify-between items-center mb-6">
                <span class="text-slate-400 font-bold uppercase tracking-widest text-xs">Total Cost</span>
                <span id="total-cost" class="text-3xl font-black">0 pts</span>
            </div>
            <button id="checkout-btn" class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-500 transition-all active:scale-95">
                Place Order
            </button>
        </div>
    </main>

    <script src="../js/cart.js"></script>
</body>
</html>
