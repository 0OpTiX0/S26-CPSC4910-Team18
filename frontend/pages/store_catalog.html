<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../config.js"></script>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store Catalog - Good Driver</title>
  <link rel="stylesheet" href="output.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

  <header class="w-full h-20 bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between">
      
      <div class="w-48 flex-shrink-0">
        <a href="index.html" class="flex items-center">
          <div class="h-10 w-10 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-lg">🚗</div>
          <span class="ml-3 font-bold text-xl tracking-tight text-slate-900 hidden sm:block">Good Driver</span>
        </a>
      </div>

      <nav class="flex-1 flex items-center justify-center gap-10">
        <a href="store_catalog.html" class="text-sm font-bold text-blue-600 border-b-2 border-blue-600 pb-1">Store</a>
        <a href="sponsor_catalog.html" class="text-sm font-semibold text-slate-500 hover:text-blue-600 transition">Sponsors</a>
        <a href="view-status.html" class="text-sm font-semibold text-slate-500 hover:text-blue-600 transition">Status</a>
        <a href="about.html" class="text-sm font-semibold text-slate-500 hover:text-blue-600 transition">About</a>
      </nav>

      <div class="inline-flex items-center gap-3 rounded-2xl border border-blue-100 bg-blue-50 px-4 py-2 shadow-sm">
        <div class="flex flex-col leading-tight">
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">
                Your Balance
            </span>
            <span id="display-points" class="text-lg font-black text-slate-900 tracking-tight">
                0 pts
            </span>
        </div>
        </div>

        <a href="cart.html" class="relative group p-2 bg-slate-100 hover:bg-slate-900 rounded-xl transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
            <span id="cart-count-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full border-2 border-white">
                0
            </span>
        </a>

      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-20">
    
    <div class="text-center mb-16">
        <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight">Driver Rewards</h1>
        <p class="text-slate-500 mt-4 max-w-lg mx-auto text-lg">
            Drive safe, earn points, and redeem them for exclusive rewards.
        </p>
    </div>

    <div id="catalog-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="p-12 text-center col-span-full">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-4"></div>
            <p class="text-slate-500 font-medium">Loading catalog...</p>
        </div>
    </div>
    
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/store_catalog.js"></script>
</body>
</html>
