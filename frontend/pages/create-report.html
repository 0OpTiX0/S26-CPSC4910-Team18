<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report an Issue - Good Driver</title>
  <link rel="stylesheet" href="output.css" />
  <script src="../config.js"></script>
  <script src="../js/api.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">
  <div class="max-w-3xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between gap-4 mb-8">
      <a id="reportBackLink" href="index.html" class="inline-flex items-center gap-2 text-sm font-bold text-blue-600 hover:text-blue-700 transition">
        <span>←</span>
        <span>Back</span>
      </a>
      <div class="h-10 w-10 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-md">🚗</div>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-8 py-8 border-b border-slate-100 bg-slate-50/70">
        <div class="inline-flex px-3 py-1 rounded-full bg-blue-50 text-blue-600 text-xs font-black tracking-widest uppercase">Support</div>
        <h1 class="mt-4 text-3xl font-black text-slate-900">Report an Issue</h1>
        <p class="mt-3 text-slate-500">
          Use this form to file a bug, account problem, purchase issue, or any other report using the backend report endpoint.
        </p>
      </div>

      <form id="reportForm" class="px-8 py-8 space-y-6">
        <div>
          <label for="reportCategory" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Category</label>
          <select id="reportCategory" class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-blue-600" required>
            <option value="">Select a category</option>
            <option value="Bug Report">Bug Report</option>
            <option value="Account">Account</option>
            <option value="Rewards Store">Rewards Store</option>
            <option value="Applications">Applications</option>
            <option value="Points">Points</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label for="reportIssueType" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Issue Type</label>
          <input id="reportIssueType" type="text" maxlength="80" placeholder="Example: Checkout error" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600" required />
        </div>

        <div>
          <label for="reportDescription" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Description</label>
          <textarea id="reportDescription" rows="7" maxlength="2000" placeholder="Describe what happened, what page you were on, and what you expected to happen." class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600" required></textarea>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <button id="submitReportBtn" type="submit" class="px-6 py-3 rounded-2xl bg-slate-900 text-white font-bold shadow-md hover:bg-blue-600 transition-all active:scale-95">
            Submit Report
          </button>
          <a href="index.html" class="px-6 py-3 rounded-2xl bg-slate-100 text-slate-700 font-bold hover:bg-slate-200 transition text-center">
            Cancel
          </a>
        </div>

        <p id="reportStatus" class="mt-4 text-sm text-slate-500"></p>
      </form>
    </div>
  </div>

  <script src="../js/report-entry.js"></script>
  <script src="../js/report-create.js"></script>
</body>
</html>
